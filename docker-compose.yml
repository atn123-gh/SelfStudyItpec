services:
  app:
    image: dockerasd/itp:v21
    build: .
    volumes:
      - .:/code
      - ./static:/code/static
      - ./.env:/code/.env
    ports:
      # Host port is configurable per machine via APP_HOST_PORT in .env
      # (defaults to 8000). Set APP_HOST_PORT=80 for a "no port in the URL"
      # deployment.
      - "${APP_HOST_PORT:-8000}:8000"
    command: sh -c "/code/entrypoint.sh"
    depends_on:
      - db
      - mongodb

  db:
    image: postgres:16.1-alpine3.19
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./utils/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./utils/backUp.sh:/home/backUp.sh
      - ./backup/:/home/backup/
      # - ./utils/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    env_file:
      - .env
    # entrypoint: ["/bin/sh", "-c", "rm -rf /var/lib/postgresql/data/*; docker-entrypoint.sh postgres"]

  mongodb:
    image: mongo:5.0
    volumes:
      - mongo_data:/data/db
      - ./mongo_data_bk:/mongo_data_bk
    environment:
      # Read from .env (via Docker Compose's own variable substitution,
      # same mechanism that resolves APP_HOST_PORT above) so this actually
      # matches MONGO_DB_USERNAME/PASSWORD instead of silently diverging
      # from whatever's set there.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    ports:
      # Bound to localhost only, on every machine — Mongo is never reachable
      # from outside the host this runs on, so no per-environment toggle is
      # needed. Use `docker compose exec mongodb mongosh ...` for shell access.
      - "127.0.0.1:27017:27017"

  nginx:
    image: nginx:1.15-alpine
    restart: unless-stopped
    volumes:
      - ./staticfiles:/staticfiles
      - ./nginx:/etc/nginx/conf.d
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    ports:
      - "83:80"
      - "443:443"
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

volumes:
  postgres_data:
  mongo_data:
  static:
