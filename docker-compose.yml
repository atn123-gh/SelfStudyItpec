services:
  app:
    image: dockerasd/itp:v21
    build: .
    volumes:
      - .:/code
      - ./static:/code/static
      - ./.env:/code/.env
    ports:
      # Host port is configurable per machine via APP_HOST_PORT in .env
      # (defaults to 8000). Bound to localhost only — for an HTTPS
      # deployment (`make up-https`), nginx is the only service that needs
      # to be internet-reachable; it reaches this over the internal
      # Docker network regardless of this binding.
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    command: sh -c "/code/entrypoint.sh"
    depends_on:
      - db
      - mongodb

  db:
    image: postgres:16.1-alpine3.19
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./utils/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./utils/backUp.sh:/home/backUp.sh
      - ./backup/:/home/backup/
      # - ./utils/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    env_file:
      - .env
    # entrypoint: ["/bin/sh", "-c", "rm -rf /var/lib/postgresql/data/*; docker-entrypoint.sh postgres"]

  mongodb:
    image: mongo:5.0
    volumes:
      - mongo_data:/data/db
      - ./mongo_data_bk:/mongo_data_bk
    environment:
      # Read from .env (via Docker Compose's own variable substitution,
      # same mechanism that resolves APP_HOST_PORT above) so this actually
      # matches MONGO_DB_USERNAME/PASSWORD instead of silently diverging
      # from whatever's set there.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    ports:
      # Bound to localhost only, on every machine — Mongo is never reachable
      # from outside the host this runs on, so no per-environment toggle is
      # needed. Use `docker compose exec mongodb mongosh ...` for shell access.
      - "127.0.0.1:27017:27017"

  # Only used for the HTTPS-via-public-IP deployment (`make up-https`).
  # Not needed for local dev or a plain-HTTP deployment.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./staticfiles:/staticfiles
      - ./nginx:/etc/nginx/conf.d
      - ./nginx/templates:/etc/nginx/templates
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    environment:
      SERVER_IP: ${SERVER_IP:-}
      # Restrict envsubst-on-templates to SERVER_IP only, so it doesn't
      # also mangle nginx's own $host/$remote_addr/etc. variables in the
      # template (those aren't shell env vars, and default envsubst
      # behavior would silently blank them out).
      NGINX_ENVSUBST_FILTER: SERVER_IP
    ports:
      - "80:80"
      - "443:443"
    # A custom `command:` bypasses the image's own auto-detection of
    # "$1 == nginx" that normally triggers /docker-entrypoint.d/ scripts
    # (including 20-envsubst-on-templates.sh, which renders
    # nginx/templates/*.template into conf.d) - so it's invoked explicitly
    # here instead, before the reload loop + nginx itself start.
    command: >
      /bin/sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && (while :; do sleep 6h & wait $${!}; nginx -s reload; done &) && nginx -g "daemon off;"'
    depends_on:
      - app

  # Only used for the HTTPS-via-public-IP deployment (`make up-https`).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # These are short-lived (~160h/6.7 day) IP-address certificates, not
    # the usual 90-day domain certs — they need a much tighter renewal
    # check interval. `certbot renew` only actually renews once within
    # its renewal window and re-uses the --preferred-profile/--ip-address
    # flags saved from the original `certonly` call (see
    # scripts/init-https.sh), so no flags are needed here.
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 6h & wait $${!}; done;'

volumes:
  postgres_data:
  mongo_data:
  static:
