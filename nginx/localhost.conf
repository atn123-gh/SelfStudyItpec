# Connect to Django (Gunicorn) via the app container's 8000 port
upstream django {
    # Specify the Django container's name (e.g., "app") and port
    server app:8000;
}

# Server block for localhost (HTTP and optional HTTPS with self-signed SSL)
server {
    listen 80;
    server_name localhost; # For local development
    server_tokens off;

    # Serve static files
    location /static/ {
        alias /staticfiles/;
        autoindex on;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Proxy requests to Django (Gunicorn)
    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: Use certbot or other ACME tools (disabled for local development)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
